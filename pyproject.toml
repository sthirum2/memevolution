[project]
name = "memevolution"
version = "0.1.0"
description = "Role 2 — AI Agent / Evolution for Memevolution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "xgboost==3.4.1",
    "pandas",
    "joblib",
    "scikit-learn",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0"]

# This repo holds several top-level folders (backend, frontend, memevolution,
# model_deployment_package). Setuptools refuses to guess which one is the
# package, so say so explicitly - otherwise `pip install -e .` fails with
# "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools.packages.find]
include = ["memevolution*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memevolution*"]

[tool.setuptools.package-data]
"memevolution.prediction.model" = ["*.json"]
